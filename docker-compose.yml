services:
  video-frame-extract:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: pimbay/asset-dedup-video-frame-extract:local
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      SOCKET_PATH: /sockets/video-frame-extract.sock
      SHARED_VOLUME_DIR: /shared
      MAX_VIDEO_DURATION_S: 3600
      TTL_SWEEP_INTERVAL_MS: 300000
      TTL_RETENTION_MS: 3600000
    volumes:
      - sockets:/sockets
      - shared-assets:/shared
    restart: unless-stopped

volumes:
  sockets:
  shared-assets:
