name: Sync main to contrib

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_MERGE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "pimbay-bot"
          git config user.email "dev@pimbay.dev"

      - name: Fast-forward contrib to main
        run: |
          git fetch origin main contrib
          git checkout contrib
          git merge --ff-only origin/main
          git push origin contrib
