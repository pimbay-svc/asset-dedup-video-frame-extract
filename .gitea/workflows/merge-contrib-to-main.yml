name: Merge contrib into main

on:
  push:
    branches: [contrib]

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_MERGE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "pimbay-bot"
          git config user.email "dev@pimbay.dev"

      - name: Merge contrib into main
        run: |
          git fetch origin main contrib
          git checkout main
          git merge --no-ff origin/contrib -m "chore: merge contrib into main [skip ci]"
          git push origin main
