name: Sync contrib to Codeberg

on:
  push:
    branches: [contrib]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push contrib to Codeberg
        run: |
          git remote add codeberg https://oauth2:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/pimbay-svc/asset-dedup-video-frame-extract.git
          git push codeberg contrib:contrib --force-with-lease
